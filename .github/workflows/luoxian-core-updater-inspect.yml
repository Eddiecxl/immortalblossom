name: LuoXian Core Updater Inspect
on:
  push:
    branches:
      - hotfix/luoxian-v30.0.3-ai-runtime
    paths:
      - '.github/workflows/luoxian-core-updater-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .inspect
          cat final-build/b64part-00 final-build/b64part-01 final-build/b64part-02 final-build/b64part-03 final-build/b64part-04 final-build/b64part-05 final-build/b64part-06 final-build/b64part-07 > final-build/source.zip.b64
          base64 -d final-build/source.zip.b64 > final-build/source.zip
          unzip -q final-build/source.zip -d .inspect
          cp -R hotfix-overlay/. .inspect/src/launcher/
      - name: Print updater path
        shell: bash
        run: |
          echo '===== MAIN ====='
          sed -n '1,460p' .inspect/src/launcher/cmd/luoxian/main.go
          echo '===== UPDATER ====='
          sed -n '1,620p' .inspect/src/launcher/internal/patch/updater.go
          echo '===== SEARCH ====='
          grep -RIn -E 'Restart|Updater|CoreFiles|LuoXian-Updater|exec.Command|StartProcess' .inspect/src/launcher/cmd .inspect/src/launcher/internal | head -360 || true
