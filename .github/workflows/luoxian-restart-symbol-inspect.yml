name: LuoXian Restart Symbol Inspect
on:
  push:
    branches: [hotfix/luoxian-v30.0.3-ai-runtime]
    paths: ['.github/workflows/luoxian-restart-symbol-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble
        shell: bash
        run: |
          set -e
          mkdir -p .inspect
          cat final-build/b64part-00 final-build/b64part-01 final-build/b64part-02 final-build/b64part-03 final-build/b64part-04 final-build/b64part-05 final-build/b64part-06 final-build/b64part-07 > final-build/source.zip.b64
          base64 -d final-build/source.zip.b64 > final-build/source.zip
          unzip -q final-build/source.zip -d .inspect
          cp -R hotfix-overlay/. .inspect/src/launcher/
          grep -RIn "refreshUpdaterOnLaunch" .inspect/src/launcher || true
          sed -n '1,150p' .inspect/src/launcher/cmd/luoxian/main_test.go
          sed -n '1,150p' .inspect/src/launcher/cmd/luoxian/updater_restart_hotfix_test.go
