name: Deploy immortalblossombeta
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Cloudflare using the repository API Token
        type: boolean
        default: false
      sync_gemini_secret:
        description: Explicitly update the existing Gemini beta secret
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: immortalblossombeta-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix cloud install --no-package-lock
      - run: node --test Source/tests/*.test.mjs
        env:
          LX_MINIFLARE_MODULE: ${{ github.workspace }}/cloud/node_modules/miniflare/dist/src/index.js
      - run: node cloud/build-web.mjs
      - name: Configure Gemini beta secret
        if: ${{ env.CF_TOKEN != '' && github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.sync_gemini_secret }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | cloud/node_modules/.bin/wrangler secret put GEMINI_API_KEY --config cloud/wrangler.jsonc
          fi
      - name: Deploy Worker from tested main
        if: ${{ env.CF_TOKEN != '' && ((github.event_name == 'workflow_dispatch' && inputs.deploy) || vars.CLOUDFLARE_AUTO_DEPLOY == 'true') }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: cloud/node_modules/.bin/wrangler deploy --config cloud/wrangler.jsonc
      - name: Verify public Worker version
        if: ${{ env.CF_TOKEN != '' && ((github.event_name == 'workflow_dispatch' && inputs.deploy) || vars.CLOUDFLARE_AUTO_DEPLOY == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cloud/node_modules/.bin/wrangler deployments list --config cloud/wrangler.jsonc
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('cloud/wrangler.jsonc'));
          const api='https://api.cloudflare.com/client/v4/accounts/'+config.account_id+'/workers/';
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          for(const suffix of ['subdomain','scripts/'+config.name+'/subdomain','scripts/'+config.name+'/settings']){
            const response=await fetch(api+suffix,{headers}),data=await response.json();
            const result=suffix.endsWith('/settings')?{version:data.result?.bindings?.find(b=>b.name==='CLOUD_VERSION')?.text}:data.result;
            console.log(JSON.stringify({diagnostic:suffix,status:response.status,success:data.success,result,errors:data.errors?.map(e=>e.code)}));
          }
          const expected=JSON.parse(fs.readFileSync('version.json')).version;
          for(let attempt=0;attempt<6;attempt++){
            const url='https://immortalblossombeta.eddiechanxule.workers.dev/api/status?release='+Date.now();
            const r=await fetch(url,{headers:{'Cache-Control':'no-cache'}}),data=await r.json();
            console.log(JSON.stringify({expected,actual:data.version,attempt}));
            if(r.ok&&data.version===expected)process.exit(0);
            if(attempt===2){
              const repaired=await fetch(api+'scripts/'+config.name+'/subdomain',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({enabled:true,previews_enabled:true})});
              const registration=await repaired.json();
              console.log(JSON.stringify({refreshWorkersDevRegistration:true,status:repaired.status,success:registration.success,result:registration.result}));
            }
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          throw Error('Public Worker did not activate the tested release.');
          JS
      - name: Explain missing deployment token
        if: ${{ env.CF_TOKEN == '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo 'Worker source and assets verified. Configure the repository CLOUDFLARE_API_TOKEN secret to enable automatic deploys.'
      - name: Manual publication selected
        if: ${{ env.CF_TOKEN != '' && !((github.event_name == 'workflow_dispatch' && inputs.deploy) || vars.CLOUDFLARE_AUTO_DEPLOY == 'true') }}
        run: echo 'Tests and web build verified. Production is published manually. Enable CLOUDFLARE_AUTO_DEPLOY only after configuring a valid Cloudflare token.'
