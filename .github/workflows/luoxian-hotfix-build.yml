name: LuoXian v30.0.4 Hotfix Build

on:
  push:
    branches:
      - hotfix/luoxian-v30.0.3-ai-runtime
    paths:
      - 'hotfix-overlay/**'
      - '.github/workflows/luoxian-hotfix-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Reassemble source and apply hotfix overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          cat final-build/b64part-00 final-build/b64part-01 final-build/b64part-02 final-build/b64part-03 final-build/b64part-04 final-build/b64part-05 final-build/b64part-06 final-build/b64part-07 > final-build/source.zip.b64
          base64 -d final-build/source.zip.b64 > final-build/source.zip
          echo "971b06609e04a6bbdfc82730f157653bf3750b27e1ca6f5e66f3dd95884c15a5  final-build/source.zip" | sha256sum -c -
          unzip -q final-build/source.zip -d .build
          cp -R hotfix-overlay/. .build/src/launcher/
      - name: Run hotfix tests
        working-directory: .build/src/launcher
        run: go test ./internal/airuntime ./internal/aihttp ./internal/config
      - name: Cross-compile Windows tree
        working-directory: .build/src/launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Build GUI launcher
        working-directory: .build/src/launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../../../out
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o ../../../out/LuoXian.exe ./cmd/luoxian
          sha256sum ../../../out/LuoXian.exe > ../../../out/SHA256SUMS.txt
      - name: Verify GUI subsystem
        run: |
          python3 - <<'PY'
          import struct
          p='out/LuoXian.exe'
          d=open(p,'rb').read()
          pe=struct.unpack_from('<I',d,0x3c)[0]
          subsystem=struct.unpack_from('<H',d,pe+24+68)[0]
          assert subsystem==2, subsystem
          print('GUI subsystem=2 OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: luoxian-v30.0.4-hotfix-launcher
          path: out/
          if-no-files-found: error
          retention-days: 7
