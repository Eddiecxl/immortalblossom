name: LuoXian v30.0.5 Verified Hotfix Patch

on:
  push:
    branches:
      - hotfix/luoxian-v30.0.3-ai-runtime
    paths:
      - 'hotfix-overlay/**'
      - '.github/workflows/luoxian-hotfix-patch.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false

      - name: Reassemble tested source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .build | Out-Null
          $b64 = ''
          0..7 | ForEach-Object { $b64 += Get-Content ("final-build/b64part-{0:D2}" -f $_) -Raw }
          [IO.File]::WriteAllBytes('final-build/source.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'final-build/source.zip' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '971b06609e04a6bbdfc82730f157653bf3750b27e1ca6f5e66f3dd95884c15a5') {
            throw "source hash mismatch: $hash"
          }
          Expand-Archive 'final-build/source.zip' -DestinationPath .build -Force
          Copy-Item 'hotfix-overlay\*' '.build\src\launcher\' -Recurse -Force

      - name: Run full Windows hotfix regression
        working-directory: .build/src/launcher
        shell: pwsh
        run: |
          go test -v ./internal/airuntime ./internal/shell ./internal/app ./internal/config ./cmd/luoxian
          if ($LASTEXITCODE -ne 0) { throw "regression tests failed" }

      - name: Build exact verified Windows launcher and patch builder
        shell: pwsh
        working-directory: .build/src/launcher
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ../../../release/payload/game | Out-Null
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o ../../../release/payload/LuoXian.exe ./cmd/luoxian
          if ($LASTEXITCODE -ne 0) { throw "launcher build failed" }
          go build -trimpath -ldflags="-s -w" -o ../../../release/lxpatch.exe ./cmd/lxpatch
          if ($LASTEXITCODE -ne 0) { throw "patch builder failed" }

      - name: Prove binary matches successful first-update E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '17D997DFC476DA5A457DE95F6D8B4AFA2D4F4BB58EE5BBC5F2CFB14EC302977F'
          $actual = (Get-FileHash 'release/payload/LuoXian.exe' -Algorithm SHA256).Hash
          Write-Host "E2E tested EXE expected=$expected"
          Write-Host "Patch EXE actual=$actual"
          if ($actual -ne $expected) { throw "patch binary does not match the successful first-update E2E binary" }

          @'
          import struct
          p='release/payload/LuoXian.exe'
          d=open(p,'rb').read()
          pe=struct.unpack_from('<I',d,0x3c)[0]
          machine=struct.unpack_from('<H',d,pe+4)[0]
          magic=struct.unpack_from('<H',d,pe+24)[0]
          subsystem=struct.unpack_from('<H',d,pe+24+68)[0]
          assert machine==0x8664, hex(machine)
          assert magic==0x20b, hex(magic)
          assert subsystem==2, subsystem
          print('LuoXian.exe PE32+ x64 GUI subsystem=2 OK')
          '@ | python -

          '{"version":"30.0.5","launcher_min":"5.1.1","save_schema":4}' | Set-Content -NoNewline -Encoding UTF8 release/payload/game/version.json

      - name: Write patch manifests
        shell: pwsh
        run: |
          @'
          {
            "format": 2,
            "patch_id": "luoxian_v30.0.5_verified_hotfix_from_30.0.2",
            "from_version": "30.0.2",
            "to_version": "30.0.5",
            "launcher_min": "5.1.1",
            "notes": [
              "Fix first-update WebView white-screen race.",
              "Verify launcher HTML before opening WebView.",
              "Show built-in dark loading UI instead of a blank white page.",
              "Retry WebView navigation until the launcher page reports ready.",
              "Prevent post-update helper refresh from rolling back the new launcher.",
              "Hide Local AI command windows and stop restart storms.",
              "Fallback once to CPU mode if GPU/Vulkan startup fails."
            ],
            "files": [
              {"path":"LuoXian.exe","kind":"core"},
              {"path":"game/version.json","kind":"direct"}
            ]
          }
          '@ | Set-Content -Encoding UTF8 release/manifest-3002.json

          @'
          {
            "format": 2,
            "patch_id": "luoxian_v30.0.5_verified_hotfix_from_30.0.4",
            "from_version": "30.0.4",
            "to_version": "30.0.5",
            "launcher_min": "5.1.1",
            "notes": [
              "Fix first-update WebView white-screen race.",
              "Verify launcher HTML before opening WebView.",
              "Show built-in dark loading UI instead of a blank white page.",
              "Retry WebView navigation until the launcher page reports ready."
            ],
            "files": [
              {"path":"LuoXian.exe","kind":"core"},
              {"path":"game/version.json","kind":"direct"}
            ]
          }
          '@ | Set-Content -Encoding UTF8 release/manifest-3004.json

      - name: Build both official lxpatch files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & release/lxpatch.exe build --root release/payload --manifest release/manifest-3002.json --out release/LuoXian-v30.0.5-Verified-Hotfix-from-30.0.2.lxpatch
          if ($LASTEXITCODE -ne 0) { throw "30.0.2 patch build failed" }
          & release/lxpatch.exe build --root release/payload --manifest release/manifest-3004.json --out release/LuoXian-v30.0.5-Verified-Hotfix-from-30.0.4.lxpatch
          if ($LASTEXITCODE -ne 0) { throw "30.0.4 patch build failed" }

          Get-FileHash release/LuoXian-v30.0.5-Verified-Hotfix-from-30.0.2.lxpatch -Algorithm SHA256 | Format-List
          Get-FileHash release/LuoXian-v30.0.5-Verified-Hotfix-from-30.0.4.lxpatch -Algorithm SHA256 | Format-List
          Get-FileHash release/payload/LuoXian.exe -Algorithm SHA256 | Format-List

      - name: Inspect both patch archives
        shell: pwsh
        run: |
          @'
          import json, zipfile
          cases=[
            ('release/LuoXian-v30.0.5-Verified-Hotfix-from-30.0.2.lxpatch','30.0.2'),
            ('release/LuoXian-v30.0.5-Verified-Hotfix-from-30.0.4.lxpatch','30.0.4'),
          ]
          for path,from_version in cases:
              with zipfile.ZipFile(path) as z:
                  names=sorted(z.namelist())
                  assert names == ['checksums.sha256','patch.json','payload/LuoXian.exe','payload/game/version.json'], names
                  meta=json.loads(z.read('patch.json'))
                  assert meta['from_version']==from_version, meta
                  assert meta['to_version']=='30.0.5', meta
                  assert meta['launcher_min']=='5.1.1', meta
                  checks=z.read('checksums.sha256').decode()
                  assert 'payload/LuoXian.exe' in checks
                  assert 'payload/game/version.json' in checks
                  print(path, meta)
                  print(checks)
          '@ | python -

      - name: Write release checksums
        shell: pwsh
        run: |
          $lines = @()
          foreach ($file in @(
            'release/LuoXian-v30.0.5-Verified-Hotfix-from-30.0.2.lxpatch',
            'release/LuoXian-v30.0.5-Verified-Hotfix-from-30.0.4.lxpatch',
            'release/payload/LuoXian.exe'
          )) {
            $h=(Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ASCII release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: luoxian-v30.0.5-verified-hotfix
          path: |
            release/LuoXian-v30.0.5-Verified-Hotfix-from-30.0.2.lxpatch
            release/LuoXian-v30.0.5-Verified-Hotfix-from-30.0.4.lxpatch
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
