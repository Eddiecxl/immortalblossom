name: LuoXian Universal AI Payload

on:
  push:
    branches:
      - build/luoxian-v30-final-20260917
    paths:
      - '.github/workflows/luoxian-ai-payload.yml'

permissions:
  contents: read

jobs:
  build-ai:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned llama.cpp Vulkan runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path downloads,payload/runtime/llama,payload/runtime/models | Out-Null
          $url = 'https://github.com/ggml-org/llama.cpp/releases/download/b10343/llama-b10343-bin-win-vulkan-x64.zip'
          & curl.exe -L --fail --retry 20 --retry-delay 5 --retry-all-errors -C - -o downloads/llama-vulkan.zip $url
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp download failed" }
          Expand-Archive downloads/llama-vulkan.zip -DestinationPath payload/runtime/llama -Force
          if (!(Test-Path payload/runtime/llama/llama-server.exe)) { throw "llama-server.exe missing" }

      - name: Download pinned Qwen3 4B Instruct 2507 IQ3_XS model with resume
        shell: pwsh
        run: |
          $url = 'https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen_Qwen3-4B-Instruct-2507-IQ3_XS.gguf?download=true'
          & curl.exe -L --fail --retry 30 --retry-delay 10 --retry-all-errors -C - -o payload/runtime/models/universal.gguf $url
          if ($LASTEXITCODE -ne 0) { throw "model download failed" }
          $size = (Get-Item payload/runtime/models/universal.gguf).Length
          Write-Host "Model bytes: $size"
          if ($size -lt 1750000000) { throw "model file is unexpectedly small" }

      - name: Split model into patch-safe GGUF shards
        shell: pwsh
        run: |
          $splitter = Resolve-Path payload/runtime/llama/llama-gguf-split.exe
          $model = Resolve-Path payload/runtime/models/universal.gguf
          & $splitter --split --split-max-size 400M $model payload/runtime/models/universal
          if ($LASTEXITCODE -ne 0) { throw "GGUF shard split failed" }
          $shards = Get-ChildItem payload/runtime/models/universal-*-of-*.gguf | Sort-Object Name
          $shards | Select-Object Name,Length | Format-Table
          if ($shards.Count -ne 5) { throw "expected 5 GGUF shards, got $($shards.Count)" }
          foreach ($s in $shards) {
            if ($s.Length -ge 520000000) { throw "patch-unsafe shard: $($s.Name) $($s.Length)" }
          }
          Remove-Item payload/runtime/models/universal.gguf

      - name: Write universal profiles
        shell: pwsh
        run: |
          $first = (Get-ChildItem payload/runtime/models/universal-00001-of-*.gguf | Select-Object -First 1).Name
          if ([string]::IsNullOrWhiteSpace($first)) { throw "first shard missing" }
          @"
          {
            "schemaVersion": 1,
            "profiles": [
              {
                "id": "lite",
                "label": "Lite · Universal Local AI",
                "model": "$first",
                "minRamGB": 6,
                "contextSize": 4096,
                "threads": 4,
                "gpuLayers": "auto",
                "maxOutputTokens": 384
              },
              {
                "id": "standard",
                "label": "Standard · Universal Local AI",
                "model": "$first",
                "minRamGB": 24,
                "contextSize": 8192,
                "threads": 8,
                "gpuLayers": "auto",
                "maxOutputTokens": 640
              }
            ]
          }
          "@ | Set-Content -Encoding UTF8 payload/runtime/models/profiles.json
          '{"profile":"auto"}' | Set-Content -Encoding UTF8 payload/runtime/models/active-profile.json

      - name: Add upstream licenses
        shell: pwsh
        run: |
          & curl.exe -L --fail --retry 10 --retry-delay 3 -o payload/runtime/llama/LICENSE-llama.cpp.txt 'https://raw.githubusercontent.com/ggml-org/llama.cpp/b10343/LICENSE'
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp license download failed" }
          & curl.exe -L --fail --retry 10 --retry-delay 3 -o payload/runtime/models/LICENSE-Qwen3-4B-Instruct-2507.txt 'https://huggingface.co/Qwen/Qwen3-4B-Instruct-2507/resolve/main/LICENSE'
          if ($LASTEXITCODE -ne 0) { throw "Qwen license download failed" }

      - name: Smoke test sharded model on Windows runner without discrete GPU
        shell: pwsh
        run: |
          $server = Resolve-Path payload/runtime/llama/llama-server.exe
          $model = Resolve-Path (Get-ChildItem payload/runtime/models/universal-00001-of-*.gguf | Select-Object -First 1).FullName
          $logOut = Join-Path $PWD 'llama-out.log'
          $logErr = Join-Path $PWD 'llama-err.log'
          $p = Start-Process -FilePath $server -ArgumentList @('--model', $model, '--host', '127.0.0.1', '--port', '24825', '--ctx-size', '2048', '--threads', '2', '--n-gpu-layers', 'auto') -PassThru -RedirectStandardOutput $logOut -RedirectStandardError $logErr
          try {
            $ready = $false
            for ($i=0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) {
                Get-Content $logOut -ErrorAction SilentlyContinue
                Get-Content $logErr -ErrorAction SilentlyContinue
                throw "llama-server exited early with code $($p.ExitCode)"
              }
              try {
                Invoke-RestMethod -Uri 'http://127.0.0.1:24825/health' -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch {}
            }
            if (!$ready) { throw "llama-server health timed out" }
            $body = @{
              model='local'
              messages=@(@{role='user';content='严格只回复四个字：落仙可用'})
              max_tokens=32
              temperature=0
            } | ConvertTo-Json -Depth 5
            $resp = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:24825/v1/chat/completions' -ContentType 'application/json' -Body $body -TimeoutSec 120
            $text = $resp.choices[0].message.content
            Write-Host "Sharded smoke generation: $text"
            if ([string]::IsNullOrWhiteSpace($text)) { throw "empty generation response" }
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Record payload hashes
        shell: pwsh
        run: |
          Get-ChildItem payload/runtime/models/universal-*-of-*.gguf | Sort-Object Name | ForEach-Object {
            Get-FileHash $_.FullName -Algorithm SHA256 | Format-List | Out-File -Append payload/AI_PAYLOAD_SHA256.txt
          }
          Get-FileHash payload/runtime/llama/llama-server.exe -Algorithm SHA256 | Format-List | Out-File -Append payload/AI_PAYLOAD_SHA256.txt
          Get-ChildItem payload/runtime/llama | Select-Object Name,Length | Format-Table | Out-File payload/LLAMA_RUNTIME_FILES.txt
          Get-Content payload/AI_PAYLOAD_SHA256.txt

      - name: Upload runtime and config
        uses: actions/upload-artifact@v4
        with:
          name: luoxian-ai-runtime-config-sharded
          path: |
            payload/runtime/llama/
            payload/runtime/models/profiles.json
            payload/runtime/models/active-profile.json
            payload/runtime/models/LICENSE-Qwen3-4B-Instruct-2507.txt
            payload/AI_PAYLOAD_SHA256.txt
            payload/LLAMA_RUNTIME_FILES.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Split GGUF shards into connector-safe transfer chunks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path transfer | Out-Null
          $chunkSize = 100000000
          $manifest = @()
          $shards = Get-ChildItem payload/runtime/models/universal-*-of-*.gguf | Sort-Object Name
          foreach ($shard in $shards) {
            $shardIndex = [int]([regex]::Match($shard.Name, '000(\d)-of-00005').Groups[1].Value)
            $src = [System.IO.File]::OpenRead($shard.FullName)
            $parts = @()
            try {
              $buffer = New-Object byte[] (4MB)
              $part = 0
              while ($src.Position -lt $src.Length) {
                $outName = ('s{0:D2}-p{1:D2}.bin' -f $shardIndex, $part)
                $outPath = Join-Path 'transfer' $outName
                $dst = [System.IO.File]::Create($outPath)
                try {
                  $remaining = [Math]::Min($chunkSize, $src.Length - $src.Position)
                  while ($remaining -gt 0) {
                    $want = [Math]::Min($buffer.Length, $remaining)
                    $read = $src.Read($buffer, 0, [int]$want)
                    if ($read -le 0) { throw 'unexpected EOF while splitting shard' }
                    $dst.Write($buffer, 0, $read)
                    $remaining -= $read
                  }
                } finally { $dst.Dispose() }
                $item = Get-Item $outPath
                $hash = (Get-FileHash $outPath -Algorithm SHA256).Hash.ToLower()
                $parts += [pscustomobject]@{ name=$outName; size=$item.Length; sha256=$hash }
                $part++
              }
            } finally { $src.Dispose() }
            $manifest += [pscustomobject]@{
              shard=$shard.Name
              size=$shard.Length
              sha256=(Get-FileHash $shard.FullName -Algorithm SHA256).Hash.ToLower()
              parts=$parts
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 transfer/manifest.json
          Get-Content transfer/manifest.json
          $allParts = Get-ChildItem transfer/*.bin
          if ($allParts.Count -ne 20) { throw "expected 20 transfer chunks, got $($allParts.Count)" }

      - name: Upload transfer manifest
        uses: actions/upload-artifact@v4
        with:
          name: luoxian-ai-shard-transfer-manifest
          path: transfer/manifest.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload transfer chunk s01-p00
        uses: actions/upload-artifact@v4
        with:
          name: luoxian-ai-transfer-s01-p00
          path: transfer/s01-p00.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload transfer chunk s01-p01
        uses: actions/upload-artifact@v4
        with:
