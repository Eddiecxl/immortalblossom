name: LuoXian Hotfix Inspect

on:
  push:
    branches:
      - hotfix/luoxian-v30.0.3-ai-runtime
    paths:
      - '.github/workflows/luoxian-hotfix-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .inspect
          cat final-build/b64part-00 final-build/b64part-01 final-build/b64part-02 final-build/b64part-03 final-build/b64part-04 final-build/b64part-05 final-build/b64part-06 final-build/b64part-07 > final-build/source.zip.b64
          base64 -d final-build/source.zip.b64 > final-build/source.zip
          echo "971b06609e04a6bbdfc82730f157653bf3750b27e1ca6f5e66f3dd95884c15a5  final-build/source.zip" | sha256sum -c -
          unzip -q final-build/source.zip -d .inspect
          cp -R hotfix-overlay/. .inspect/src/launcher/
      - name: Print runtime supervisor sources
        shell: bash
        run: |
          set -euo pipefail
          for f in             .inspect/src/launcher/internal/airuntime/manager.go             .inspect/src/launcher/internal/airuntime/manager_test.go             .inspect/src/launcher/internal/airuntime/profiles.go             .inspect/src/launcher/internal/aihttp/handler.go             .inspect/src/launcher/cmd/luoxian/main.go; do
              echo "===== FILE: $f ====="
              sed -n '1,320p' "$f"
          done
