name: LuoXian Hotfix Inspect

on:
  push:
    branches:
      - hotfix/luoxian-v30.0.3-ai-runtime
    paths:
      - '.github/workflows/luoxian-hotfix-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .inspect
          cat final-build/b64part-00 final-build/b64part-01 final-build/b64part-02 final-build/b64part-03 final-build/b64part-04 final-build/b64part-05 final-build/b64part-06 final-build/b64part-07 > final-build/source.zip.b64
          base64 -d final-build/source.zip.b64 > final-build/source.zip
          echo "971b06609e04a6bbdfc82730f157653bf3750b27e1ca6f5e66f3dd95884c15a5  final-build/source.zip" | sha256sum -c -
          unzip -q final-build/source.zip -d .inspect
          cp -R hotfix-overlay/. .inspect/src/launcher/
      - name: Inspect browser AI recovery paths
        shell: bash
        run: |
          set -euo pipefail
          echo "===== RECOVERY SEARCH ====="
          grep -RIn --include='*.js' -E 'recover|EnsureReady|/api/ai/(recover|generate|status|start)' .inspect 2>/dev/null | head -250 || true

      - name: Inspect patch current-version source
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn -E 'ScanChain\(|GameVersion|version.json' .inspect/src/launcher/internal .inspect/src/launcher/cmd | head -300 || true

      - name: Inspect patch generator sources
        shell: bash
        run: |
          set -euo pipefail
          for f in .inspect/src/launcher/cmd/lxpatch/main.go .inspect/src/launcher/internal/patch/*.go; do
            echo "===== PATCHFILE: $f ====="
            sed -n '1,420p' "$f"
          done

      - name: Emit exact manager source
        shell: bash
        run: |
          echo "MANAGER_B64=$(base64 -w0 .inspect/src/launcher/internal/airuntime/manager.go)"

      - name: Print runtime supervisor sources
        shell: bash
        run: |
          set -euo pipefail
          for f in             .inspect/src/launcher/internal/airuntime/manager.go             .inspect/src/launcher/internal/airuntime/manager_test.go             .inspect/src/launcher/internal/airuntime/profiles.go             .inspect/src/launcher/internal/aihttp/handler.go             .inspect/src/launcher/cmd/luoxian/main.go; do
              echo "===== FILE: $f ====="
              if [[ "$f" == *"/manager.go" ]]; then
                sed -n '300,760p' "$f"
              else
                sed -n '1,360p' "$f"
              fi
          done
