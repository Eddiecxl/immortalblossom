name: LuoXian Final Windows Build

on:
  push:
    branches:
      - build/luoxian-v30-final-20260917

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.25.0
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false

      - name: Reassemble and verify source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .final-build
          cat final-build/b64part-00 final-build/b64part-01 final-build/b64part-02 final-build/b64part-03 final-build/b64part-04 final-build/b64part-05 final-build/b64part-06 final-build/b64part-07 > final-build/launcher-build-source-final.zip.b64
          base64 -d final-build/launcher-build-source-final.zip.b64 > final-build/launcher-build-source-final.zip
          echo "971b06609e04a6bbdfc82730f157653bf3750b27e1ca6f5e66f3dd95884c15a5  final-build/launcher-build-source-final.zip" | sha256sum -c -
          unzip -q final-build/launcher-build-source-final.zip -d .final-build
          test -f .final-build/src/launcher/go.mod

      - name: Run platform-neutral Go tests
        working-directory: .final-build/src/launcher
        run: |
          set -euo pipefail
          go test ./internal/aihttp ./internal/airuntime ./internal/config ./internal/content ./internal/repair ./internal/storage ./internal/worlddb

      - name: Cross-compile complete Windows launcher tree
        working-directory: .final-build/src/launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go build ./...

      - name: Build Windows binaries
        working-directory: .final-build/src/launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p ../../../final-output
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o ../../../final-output/LuoXian.exe ./cmd/luoxian
          go build -trimpath -ldflags='-s -w' -o ../../../final-output/lxpatch.exe ./cmd/lxpatch

      - name: Verify Windows binaries and checksums
        run: |
          set -euo pipefail
          cd final-output
          file LuoXian.exe lxpatch.exe
          python3 - <<'PY'
          import struct
          for path, expected_subsystem in [('LuoXian.exe', 2), ('lxpatch.exe', 3)]:
              data = open(path, 'rb').read()
              pe = struct.unpack_from('<I', data, 0x3c)[0]
              machine = struct.unpack_from('<H', data, pe + 4)[0]
              magic = struct.unpack_from('<H', data, pe + 24)[0]
              subsystem = struct.unpack_from('<H', data, pe + 24 + 68)[0]
              assert machine == 0x8664, (path, hex(machine))
              assert magic == 0x20b, (path, hex(magic))
              assert subsystem == expected_subsystem, (path, subsystem, expected_subsystem)
              print(path, 'PE32+ x64 subsystem', subsystem, 'OK')
          PY
          sha256sum LuoXian.exe lxpatch.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Upload final binaries
        uses: actions/upload-artifact@v4
        with:
          name: luoxian-v30-final-binaries
          path: final-output/
          if-no-files-found: error
          retention-days: 7
